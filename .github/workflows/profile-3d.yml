name: Update Profile (3D charts & latest repos)

on:
  schedule:
    # 22:00 UTC = 03:00 in Karachi
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile-3d-contrib/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render 3D contribution calendar
        run: python3 .github/scripts/contrib_3d.py "${{ github.repository_owner }}" profile-3d-contrib/calendar-3d.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render 3D radar & language donut
        run: python3 .github/scripts/stats_3d.py "${{ github.repository_owner }}" profile-3d-contrib/stats-3d.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh recently updated repos in README
        run: python3 .github/scripts/latest_repos.py "${{ github.repository_owner }}" README.md 6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit & push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A profile-3d-contrib README.md
          git commit -m "Update profile charts & latest repos [skip ci]" || exit 0
          git push
