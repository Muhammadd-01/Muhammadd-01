<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-label="AI Researcher project cover">
<style>
.float{animation:fl 5s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.pulse{animation:pu 2.2s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 24s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 4s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.draw{stroke-dasharray:600;animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dashoffset:600}60%,100%{stroke-dashoffset:0}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b18"/><stop offset="1" stop-color="#1f0b3d"/></linearGradient>
<radialGradient id="gl" cx=".78" cy=".5" r=".45"><stop offset="0" stop-color="#A78BFA" stop-opacity=".35"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
<clipPath id="cl"><rect width="800" height="420" rx="18"/></clipPath>
</defs>
<g clip-path="url(#cl)" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<rect width="800" height="420" fill="url(#bg)"/><rect width="800" height="420" fill="url(#grid)"/><rect width="800" height="420" fill="url(#gl)"/>
<text x="44" y="66" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#A78BFA" text-anchor="start" letter-spacing="3">FEATURED PROJECT</text>
<text x="42" y="120" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="-.5">AI Researcher</text>
<text x="44" y="160" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#B8C7DD" text-anchor="start" >Autonomous research agent that</text>
<text x="44" y="186" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#B8C7DD" text-anchor="start" >summarises the web with a local LLM.</text>
<g><rect x="44" y="234" width="103" height="28" rx="14.0" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.55"/><text x="95.5" y="252.5" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#A78BFA" text-anchor="middle" >Next.js 15</text></g>
<g><rect x="155" y="234" width="80" height="28" rx="14.0" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.55"/><text x="195.0" y="252.5" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#A78BFA" text-anchor="middle" >FastAPI</text></g>
<g><rect x="243" y="234" width="80" height="28" rx="14.0" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.55"/><text x="283.0" y="252.5" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#A78BFA" text-anchor="middle" >PyTorch</text></g>
<g><rect x="331" y="234" width="80" height="28" rx="14.0" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.55"/><text x="371.0" y="252.5" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#A78BFA" text-anchor="middle" >Qwen2.5</text></g>
