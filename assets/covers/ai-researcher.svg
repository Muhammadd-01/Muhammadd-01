system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >Local</text><text x="680" y="224" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >LLM</text><path d="M726,210 L760,210" stroke="#A78BFA" stroke-width="2"/><rect x="742" y="250" width="1" height="1" fill="none"/><rect x="700" y="280" width="78" height="64" rx="8" fill="#1e1036" stroke="#A78BFA" stroke-opacity=".6"/><rect x="712" y="294" width="54" height="5" rx="2" fill="#E9D5FF" fill-opacity=".7"/><rect x="712" y="306" width="46" height="5" rx="2" fill="#E9D5FF" fill-opacity=".7"/><rect x="712" y="318" width="38" height="5" rx="2" fill="#E9D5FF" fill-opacity=".7"/><rect x="712" y="330" width="30" height="5" rx="2" fill="#E9D5FF" fill-opacity=".7"/><path d="M680,256 L720,280" stroke="#A78BFA" stroke-opacity=".6" stroke-width="2"/></g>
