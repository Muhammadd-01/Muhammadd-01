<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-label="AI Hotel Manager project cover">
<style>
.float{animation:fl 5s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.pulse{animation:pu 2.2s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 24s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 4s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.draw{stroke-dasharray:600;animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dashoffset:600}60%,100%{stroke-dashoffset:0}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b18"/><stop offset="1" stop-color="#3a2405"/></linearGradient>
<radialGradient id="gl" cx=".78" cy=".5" r=".45"><stop offset="0" stop-color="#F59E0B" stop-opacity=".35"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#10B981"/></linearGradient>
