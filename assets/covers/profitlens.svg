<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-label="ProfitLens project cover">
<style>
.float{animation:fl 5s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.pulse{animation:pu 2.2s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 24s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 4s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.draw{stroke-dasharray:600;animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dashoffset:600}60%,100%{stroke-dashoffset:0}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b18"/><stop offset="1" stop-color="#053b2e"/></linearGradient>
<radialGradient id="gl" cx=".78" cy=".5" r=".45"><stop offset="0" stop-color="#10B981" stop-opacity=".35"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
<clipPath id="cl"><rect width="800" height="420" rx="18"/></clipPath>
</defs>
<g clip-path="url(#cl)" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<rect width="800" height="420" fill="url(#bg)"/><rect width="800" height="420" fill="url(#grid)"/><rect width="800" height="420" fill="url(#gl)"/>
<text x="44" y="66" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="start" letter-spacing="3">FEATURED PROJECT</text>
<text x="42" y="120" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="-.5">ProfitLens</text>
<text x="44" y="160" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#B8C7DD" text-anchor="start" >AI business intelligence for SMBs:</text>
<text x="44" y="186" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#B8C7DD" text-anchor="start" >forecasting, churn &amp; segmentation.</text>
<g><rect x="44" y="234" width="103" height="28" rx="14.0" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.55"/><text x="95.5" y="252.5" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#10B981" text-anchor="middle" >React + TS</text></g>
<g><rect x="155" y="234" width="80" height="28" rx="14.0" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.55"/><text x="195.0" y="252.5" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#10B981" text-anchor="middle" >FastAPI</text></g>
<g><rect x="243" y="234" width="119" height="28" rx="14.0" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.55"/><text x="302.5" y="252.5" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#10B981" text-anchor="middle" >scikit-learn</text></g>
<g><rect x="370" y="234" width="80" height="28" rx="14.0" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.55"/><text x="410.0" y="252.5" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#10B981" text-anchor="middle" >MongoDB</text></g>
<g class="float"><rect x="490" y="70" width="280" height="290" rx="18" fill="#0b1426" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".08"/><text x="512" y="102" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="start" >Revenue forecast</text><text x="748" y="102" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end" >AI</text><rect class="grow" x="520" y="240" width="26" height="90" rx="5" fill="url(#ac)" fill-opacity=".55" style="animation-delay:-0.0s"/><rect class="grow" x="564" y="200" width="26" height="130" rx="5" fill="url(#ac)" fill-opacity=".55" style="animation-delay:-0.5s"/><rect class="grow" x="608" y="220" width="26" height="110" rx="5" fill="url(#ac)" fill-opacity=".55" style="animation-delay:-1.0s"/><rect class="grow" x="652" y="160" width="26" height="170" rx="5" fill="url(#ac)" fill-opacity=".55" style="animation-delay:-1.5s"/><rect class="grow" x="696" y="180" width="26" height="150" rx="5" fill="url(#ac)" fill-opacity=".55" style="animation-delay:-2.0s"/><path d="M520,280 L566,240 L610,255 L654,190 L698,205" fill="none" stroke="#fff" stroke-width="3" class="draw"/><path d="M698,205 L748,150" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="6 6"/><path d="M698,205 L748,125 L748,180 Z" fill="#10B981" fill-opacity=".18"/><circle cx="748" cy="150" r="6" fill="#10B981" class="pulse"/><line x1="512" y1="331" x2="756" y2="331" stroke="#fff" stroke-opacity=".2"/></g>
</g><rect x=".5" y=".5" width="799" height="419" rx="18" fill="none" stroke="#10B981" stroke-opacity=".4"/></svg>