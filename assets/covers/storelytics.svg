grow" x="692" y="190" width="22" height="140" rx="4" fill="url(#ac)" style="animation-delay:-2.0s"/><rect class="grow" x="728" y="215" width="22" height="115" rx="4" fill="url(#ac)" style="animation-delay:-2.4000000000000004s"/><rect x="620" y="182" width="134" height="26" rx="13" fill="#EF4444" fill-opacity=".18" stroke="#EF4444" class="pulse"/><text x="687" y="199" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#FCA5A5" text-anchor="middle" >⚠ Low stock: 3</text></g>
