<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="16" viewBox="0 0 1200 16">
<defs>
<linearGradient id="base" x1="0" x2="1"><stop offset="0" stop-color="#0052D4" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8" stop-opacity=".5"/><stop offset="1" stop-color="#0052D4" stop-opacity="0"/></linearGradient>
<linearGradient id="pulse" x1="0" x2="1"><stop offset="0" stop-color="#00C9FF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#00C9FF" stop-opacity="0"/></linearGradient>
<filter id="g" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<rect x="0" y="7" width="1200" height="2" fill="url(#base)"/>
<g filter="url(#g)"><rect y="6" width="220" height="4" fill="url(#pulse)"><animate attributeName="x" values="-220;1200" dur="4.5s" repeatCount="indefinite"/></rect></g>
<rect y="7" width="160" height="2" fill="url(#pulse)"><animate attributeName="x" values="-160;1200" dur="4.5s" begin="0.15s" repeatCount="indefinite"/></rect>
</svg>